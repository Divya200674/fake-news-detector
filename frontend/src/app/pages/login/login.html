<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <div class="logo">🛡️ VeriTruth AI</div>
      <h2>Welcome Back</h2>
      <p>Log in to access full fake news detection tools.</p>
    </div>

    <!-- Display error message if backend returns an error -->
    <p *ngIf="errorMessage" style="color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem; text-align: center;">
      {{ errorMessage }}
    </p>

    <!-- Attach (ngSubmit) to trigger your onLogin() function -->
    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          placeholder="name@example.com" 
          [(ngModel)]="credentials.email"
          required 
        />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password"
          placeholder="••••••••" 
          [(ngModel)]="credentials.password"
          required 
        />
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" /> Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="card-footer">
      <p>Don't have an account? <a routerLink="/register">Create Account</a></p>
      <a routerLink="/" class="back-home">← Back to Home</a>
    </div>
  </div>
</div>
