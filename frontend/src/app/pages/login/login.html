<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <div class="logo">🛡️ VeriTruth AI</div>
      <h2>Welcome Back</h2>
      <p>Sign in to access AI detection tools.</p>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="credentials.email"
          name="email"
          placeholder="name@example.com" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="credentials.password"
          name="password"
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" class="btn-primary btn-block">Sign In</button>
    </form>

    <p *ngIf="errorMessage" class="error" style="color: red; text-align: center; margin-top: 1rem;">
      {{ errorMessage }}
    </p>

    <div class="card-footer">
      <p>Don't have an account? <a routerLink="/register">Create Account</a></p>
      <a routerLink="/" class="back-home">← Back to Home</a>
    </div>
  </div>
</div>
