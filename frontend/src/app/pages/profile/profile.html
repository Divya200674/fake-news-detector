<div class="page-layout">
  <!-- Top Navigation Bar -->
  <nav class="dash-navbar">
    <div class="logo">
      <span class="logo-icon">🛡️</span>
      <span class="logo-text">VeriTruth AI</span>
    </div>
    <div class="nav-actions">
      <a routerLink="/" class="nav-item">Home</a>
      <a routerLink="/dashboard" class="nav-item">Dashboard</a>
      <a routerLink="/history" class="nav-item">History</a>
      <a routerLink="/profile" class="nav-item active">Profile</a>
      <button class="btn-logout" routerLink="/login">Logout</button>
    </div>
  </nav>

  <div class="page-content">
    <header class="page-header">
      <h2>👤 Account Profile</h2>
      <p>Manage your account credentials and personal details.</p>
    </header>

    <div class="profile-card">
      <!-- Profile Picture Section -->
      <div class="avatar-section">
        <div class="avatar-circle">
          <img *ngIf="profileImage()" [src]="profileImage()" alt="Profile Avatar" class="avatar-img" />
          <span *ngIf="!profileImage()">👤</span>
        </div>
        <input 
          type="file" 
          id="photoInput" 
          class="file-input" 
          accept="image/*"
          (change)="onFileSelected($event)" 
          hidden 
        />
        <label for="photoInput" class="btn btn-outline btn-sm">Change Photo</label>
      </div>

      <!-- Personal Details Form -->
      <form class="profile-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" value="Divya" class="form-input" />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" value="divya@gmail.com" class="form-input" />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" value="9876543210" class="form-input" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" value="********" class="form-input" />
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-secondary">Cancel</button>
          <button type="button" class="btn btn-danger" routerLink="/login">Logout</button>
        </div>
      </form>
    </div>
  </div>
</div>
