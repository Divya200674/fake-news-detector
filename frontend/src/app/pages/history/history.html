<div class="history-container">
  <h2>Detection History</h2>

  <!-- Controls Header -->
  <div class="controls-bar">
    <input 
      type="text" 
      placeholder="Search history..." 
      [ngModel]="searchQuery()" 
      (ngModelChange)="searchQuery.set($event)" 
    />

    <select [ngModel]="selectedFilter()" (ngModelChange)="selectedFilter.set($event)">
      <option value="All">All Types</option>
      <option value="Text">Text</option>
      <option value="Image">Image</option>
      <option value="URL">URL</option>
    </select>

    <button (click)="deleteAllHistory()" class="btn-danger">Clear All</button>
  </div>

  <!-- History Table -->
  <table class="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Name/Content</th>
        <th>Prediction</th>
        <th>Confidence</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of filteredHistory()">
        <td>{{ item.date }}</td>
        <td>{{ item.type }}</td>
        <td><a [routerLink]="item.link">{{ item.name }}</a></td>
        <td>
          <span [class.badge-fake]="item.prediction === 'Fake'" [class.badge-real]="item.prediction === 'Real'">
            {{ item.prediction }}
          </span>
        </td>
        <td>{{ item.confidence }}</td>
        <td>
          <button (click)="deleteItem(item.id)" class="btn-delete">Delete</button>
        </td>
      </tr>

      <!-- Empty State Row (Fixes the closing </tr> error) -->
      <tr *ngIf="filteredHistory().length === 0">
        <td colspan="6" style="text-align: center; padding: 2rem;">
          No history records found.
        </td>
      </tr>
    </tbody>
  </table>
</div>
