<div class="history-container">
  <div class="history-card">
    <h2>Detection History</h2>

    <div class="filter-bar">
      <input 
        type="text" 
        placeholder="Search history..." 
        [(ngModel)]="searchQuery" 
      />
      <select [(ngModel)]="selectedType">
        <option value="all">All Types</option>
        <option value="text">Text</option>
        <option value="image">Image</option>
        <option value="url">URL</option>
        <option value="video">Video</option>
        <option value="audio">Audio</option>
      </select>
      <button class="btn-clear" (click)="clearAll()">Clear All</button>
    </div>

    <table class="history-table" *ngIf="filteredHistory.length > 0; else emptyState">
      <thead>
        <tr>
          <th>DATE</th>
          <th>TYPE</th>
          <th>NAME/CONTENT</th>
          <th>PREDICTION</th>
          <th>CONFIDENCE</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredHistory">
          <td>{{ item.date }}</td>
          <td>{{ item.type }}</td>
          <td><a href="#">{{ item.name }}</a></td>
          <td>
            <span class="badge" [ngClass]="item.prediction.toLowerCase()">
              {{ item.prediction }}
            </span>
          </td>
          <td>{{ item.confidence }}</td>
          <td>
            <button class="btn-delete" (click)="deleteItem(item.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <div class="no-history">
        <p>No detection history found.</p>
      </div>
    </ng-template>
  </div>
</div>
